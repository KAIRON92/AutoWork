name: AutoWork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema=../prisma/schema.prisma
      - run: npm run build
      - run: npm test -- --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-1234567890-1234567890
          DATABASE_URL: postgresql://autowork:autoworkpass@localhost:5432/autowork_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PCLOUD_DEFAULT_PROVIDER: pcloud
          PCLOUD_ALLOW_MOCK: false
          PCLOUD_CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
