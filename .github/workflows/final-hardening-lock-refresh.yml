name: Final Hardening Lockfile Sync

on:
  push:
    branches: [final-hardening]
    paths:
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/final-hardening-lock-refresh.yml

permissions:
  contents: write

jobs:
  sync-backend-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Backend lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: sync backend npm lockfile [skip lock-refresh]"
          git push origin HEAD:final-hardening
