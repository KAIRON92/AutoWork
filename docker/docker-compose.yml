version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://autowork:autoworkpass@postgres:5432/autowork_db?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-key-autowork-2026}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-mock_pcloud}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://autowork:autoworkpass@postgres:5432/autowork_db?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-mock_pcloud}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
    depends_on:
      - backend
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autowork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoworkpass}
      POSTGRES_DB: ${POSTGRES_DB:-autowork_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
