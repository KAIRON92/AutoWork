services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY is required}
      - EMAIL_DEFAULT_PROVIDER=${EMAIL_DEFAULT_PROVIDER:-}
      - EMAIL_ALLOW_FAKE=${EMAIL_ALLOW_FAKE:-false}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI:-http://localhost:4000/api/v1/email/accounts/gmail/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker-campaign:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY is required}
    command: ["npx", "ts-node", "--transpile-only", "../workers/campaign.worker.entry.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PCLOUD_DEFAULT_PROVIDER=${PCLOUD_DEFAULT_PROVIDER:-pcloud}
      - PCLOUD_ALLOW_MOCK=${PCLOUD_ALLOW_MOCK:-false}
      - PCLOUD_API_HOST=${PCLOUD_API_HOST:-https://api.pcloud.com}
      - PCLOUD_API_URL=${PCLOUD_API_URL:-https://api.pcloud.com}
      - PCLOUD_CREDENTIAL_ENCRYPTION_KEY=${PCLOUD_CREDENTIAL_ENCRYPTION_KEY:?PCLOUD_CREDENTIAL_ENCRYPTION_KEY is required}
    command: ["npx", "ts-node", "--transpile-only", "../workers/pcloud-share.worker.entry.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autowork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-autowork_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
